[project]
name = "iconographers"
version = "0.1.0"
description = "The iconographers: agent-based models of iconic, compositional vocalisations and maps, negation and quantifiers (Mesa and NetLogo)"
readme = "README.md"
authors = [
    { name = "alexanderporto@posteo.net", email = "alexanderporto@posteo.net" }
]
requires-python = ">=3.14"
dependencies = [
    "matplotlib>=3.11.2",
    "mesa>=3.5.2",
    "numpy>=2.5.4",
    "pandas>=3.1.0",
]

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
